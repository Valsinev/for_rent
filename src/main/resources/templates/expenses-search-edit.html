<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{add.expense}">Add Expense</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/style/home.css">

</head>
<body class="container mt-5">

<h1 th:text="#{add.expense}">Add Expense</h1>

<form th:action="@{/admin/expenses/addExpense}"
      method="post" th:object="${expenseDto}">

    <input type="hidden" th:field="*{id}" />
    <input type="hidden" name="expenseName" th:value="${expenseName}" />


    <div class="mb-3">
        <label for="name" class="form-label" th:text="#{name}">Name:</label>
        <small class="col-12 text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
        <input type="text" id="name" name="name" th:field="*{name}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label" th:text="#{description}">Description:</label>
        <small class="col-12 text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
        <input type="text" id="description" name="description" th:field="*{description}" class="form-control">
    </div>
    <div class="mb-3">
        <label for="date" class="form-label" th:text="#{date}">Date:</label>
        <small class="col-12 text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></small>
        <input type="date" id="date" name="date"
               th:value="${expenseDto.date != null} ? ${T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd').format(expenseDto.date)} : ''"
               class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="amount" class="form-label" th:text="#{amount}">Amount:</label>
        <small class="col-12 text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></small>
        <input type="number" id="amount" name="amount" th:field="*{amount}" class="form-control" min="10" step="0.01" required>
    </div>

    <div class="card mb-3">
    </div>

    <button type="submit" class="btn btn-success" th:text="#{save}">Save</button>
    <a class="btn btn-warning" th:text="#{return}" th:href="@{'/admin/expenses'}">Return</a>
</form>

</body>
</html>
